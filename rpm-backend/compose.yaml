services:
  backend:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      ENABLE_DOCS: "false"
    ports:
      - "127.0.0.1:8000:8000"
    command: ["python", "-m", "app", "--host", "0.0.0.0", "--trusted-proxies", "${TRUSTED_PROXY_IPS:-}"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
